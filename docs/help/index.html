<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Sofa Tube · Help a TV</title>
    <!--
      Remote help (0.9.5 item 42), the helper's page: the same help part as
      the phone page's "I'm helping" mode (help-core.js). Static, no server
      of ours, no tracking. Published at a release as
      sofatube.github.io/help/ (README.md here). The code arrives in the
      link (#o=…) or is pasted; nothing in the address goes to a server.
    -->
    <style>
      :root {
        --bg: #fbf4e8;
        --card: #ffffff;
        --line: #eadfcd;
        --text: #1f140d;
        --muted: #6f5a47;
        --field: #f5ecdf;
        --field-line: #e0d0b9;
        --accent: #a84500;
        --accent-ink: #ffffff;
        --title: #93441a;
        --ok: #1b7f37;
        --bad: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #170e08;
          --card: #24180f;
          --line: #3a2819;
          --text: #fbf4e8;
          --muted: #b9a690;
          --field: #2f2015;
          --field-line: #4e3624;
          --accent: #ff8a00;
          --accent-ink: #1f140d;
          --title: #fbf4e8;
          --ok: #4cc26a;
          --bad: #ff6b6b;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Noto Kufi Arabic',
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 12px 16px 40px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header b {
        color: var(--title);
        font-size: 1.2rem;
      }
      header button {
        font: inherit;
        border: 1px solid var(--field-line);
        background: var(--field);
        color: var(--text);
        border-radius: 999px;
        padding: 6px 12px;
      }
    </style>
  </head>
  <body>
    <main id="main">
      <header>
        <b id="brand">Sofa Tube</b>
        <button id="lang" type="button">العربية</button>
      </header>
    </main>
    <!-- away-095's mailbox crypto (remembered helpers): sofatube.github.io/remote/ -->
    <script src="../remote/away-crypto.js"></script>
    <script src="help-core.js"></script>
    <script>
      (function () {
        'use strict';
        var html = document.documentElement;
        var saved = '';
        try {
          saved = localStorage.getItem('ytx-help-lang') || '';
        } catch (e) {}
        var lang =
          saved || (/^ar\b/i.test(navigator.language || '') ? 'ar' : 'en');
        var main = document.getElementById('main');
        var view = document.createElement('div');
        main.appendChild(view);
        var helper = null;
        function draw() {
          html.lang = lang;
          html.dir = lang === 'ar' ? 'rtl' : 'ltr';
          document.getElementById('brand').textContent =
            lang === 'ar' ? 'صوفا تيوب' : 'Sofa Tube';
          document.getElementById('lang').textContent =
            lang === 'ar' ? 'English' : 'العربية';
          // a language change keeps the session: only drawn again
          if (helper) helper.redraw();
          else helper = window.SofaHelp.mountHelper(view);
        }
        document.getElementById('lang').addEventListener('click', function () {
          lang = lang === 'ar' ? 'en' : 'ar';
          try {
            localStorage.setItem('ytx-help-lang', lang);
          } catch (e) {}
          draw();
        });
        draw();
      })();
    </script>
  </body>
</html>
