<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sofa Tube remote</title>
    <meta
      name="description"
      content="Opens the Sofa Tube remote on your phone and finds your TV on your Wi-Fi."
    />
    <!-- the Arabic page swaps this for manifest-ar.webmanifest -->
    <link id="manifest" rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      name="theme-color"
      content="#fbf4e8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#170e08"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sofa Tube" />
    <style>
      :root {
        /* Sofa Tube palette (phone page, src/theme.css) */
        --bg: #fbf4e8;
        --card: #ffffff;
        --line: #eadfcd;
        --text: #1f140d;
        --muted: #6f5a47;
        --field: #f5ecdf;
        --field-line: #e0d0b9;
        --accent: #a84500;
        --accent-ink: #ffffff;
        --title: #93441a;
        --ok: #1b7f37;
        --bad: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #170e08;
          --card: #24180f;
          --line: #3a2819;
          --text: #fbf4e8;
          --muted: #b9a690;
          --field: #2f2015;
          --field-line: #4e3624;
          --accent: #ff8a00;
          --accent-ink: #1f140d;
          --title: #fbf4e8;
          --ok: #4cc26a;
          --bad: #ff6b6b;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Noto Sans Arabic',
          sans-serif;
      }
      html[lang='ar'] body {
        font-size: 17px;
        line-height: 1.65;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 16px 16px 40px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0 16px;
      }
      header img {
        width: 52px;
        height: 52px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
        color: var(--title);
        flex: 1;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 6px;
        color: var(--title);
      }
      p {
        margin: 0 0 10px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        margin: 12px 0;
      }
      .muted,
      .small {
        color: var(--muted);
      }
      .small {
        font-size: 14px;
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .btn {
        background: var(--accent);
        color: var(--accent-ink);
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
      }
      .btn.ghost {
        background: var(--field);
        color: var(--text);
        border: 1px solid var(--field-line);
      }
      .btn.small {
        padding: 6px 10px;
        font-size: 14px;
        font-weight: 500;
      }
      #status {
        font-weight: 600;
      }
      #status:empty,
      #detail:empty {
        display: none;
      }
      #status.ok {
        color: var(--ok);
      }
      #status.bad {
        color: var(--bad);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-top: 1px solid var(--line);
      }
      li:first-child {
        border-top: 0;
      }
      /* Arabic: an address keeps its order, on the right like the text */
      [dir='rtl'] li .addr {
        text-align: right;
      }
      li .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      li .addr {
        flex: 1 1 100%;
        white-space: nowrap;
        direction: ltr;
        unicode-bidi: isolate;
        text-align: start;
        font-variant-numeric: tabular-nums;
      }
      form {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        font: inherit;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--field-line);
        background: var(--field);
        color: var(--text);
        direction: ltr;
      }
      .hidden {
        display: none;
      }
      #share-card {
        border: 2px solid var(--accent);
      }
      #share-what {
        direction: ltr;
        unicode-bidi: isolate;
        font-variant-numeric: tabular-nums;
        word-break: break-all;
      }
      li.live .addr::after {
        content: ' ●';
        color: var(--ok);
      }
      #scanbox video {
        width: 100%;
        max-height: 60vh;
        border-radius: 10px;
        background: #000;
        margin-top: 10px;
      }
      #lang {
        background: none;
        border: 1px solid var(--field-line);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 10px;
        font: inherit;
        font-size: 14px;
      }
      /* 0.9.6: the TV's whole phone page inside the app (home channel) */
      #full {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: var(--bg);
      }
      /* 0.9.7: the bar back to the TVs (more than one TV) */
      #full .fullbar {
        display: none;
      }
      #full.bar {
        display: flex;
        flex-direction: column;
      }
      #full.bar.hidden {
        display: none;
      }
      #full.bar .fullbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 10px;
        border-bottom: 1px solid var(--line);
      }
      #full.bar iframe {
        flex: 1;
        height: auto;
      }
      #full-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
        unicode-bidi: isolate;
      }
      li .tvname {
        flex: 1 1 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow-wrap: anywhere;
      }
      li.awayrow .tvname {
        flex: 1 1 150px;
      }
      li .tvname .addr {
        font-size: 13px;
        color: var(--muted);
      }
      li.live .tvname strong::after {
        content: ' ●';
        color: var(--ok);
      }
      li.live .tvname .addr::after {
        content: '';
      }
      #full iframe {
        display: block;
        border: 0;
        width: 100%;
        height: 100%;
      }
      /* 0.9.6: the code the TV shows too (Join with OK on the TV) */
      .joincode {
        font-size: 2.4rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-align: center;
        margin: 10px 0;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="icon-192.png" alt="" />
        <h1 id="title"></h1>
        <button id="lang" type="button"></button>
      </header>
      <p id="lead" class="muted"></p>

      <!-- a video shared from another app (Android's Share menu) -->
      <section class="card hidden" id="share-card">
        <h2 id="share-title"></h2>
        <p id="share-what" class="small"></p>
      </section>

      <section class="card">
        <p id="status" role="status" aria-live="polite"></p>
        <p id="detail" class="small"></p>
        <div class="btns">
          <button id="find" class="btn hidden" type="button"></button>
          <a id="go-home" class="btn hidden" href="#"></a>
          <a id="go-away" class="btn ghost hidden" href="away.html"></a>
          <button id="scan" class="btn ghost hidden" type="button"></button>
        </div>
        <!-- what answered on the Wi-Fi: the phone's owner picks (0.9.6) -->
        <div id="pickbox" class="hidden">
          <ul id="picklist"></ul>
        </div>
        <div id="joinbox" class="hidden">
          <p id="join-how" class="small"></p>
          <p id="join-code" class="joincode" dir="ltr"></p>
          <div class="btns">
            <button id="join-same" class="btn" type="button"></button>
            <button id="join-diff" class="btn ghost" type="button"></button>
            <button id="join-stop" class="btn ghost" type="button"></button>
          </div>
        </div>
        <div id="scanbox" class="hidden">
          <video id="scanvideo" playsinline muted></video>
          <div class="btns">
            <button id="scan-stop" class="btn ghost" type="button"></button>
          </div>
        </div>
      </section>

      <section class="card" id="known-card">
        <h2 id="known-title"></h2>
        <ul id="known"></ul>
        <form id="manual">
          <input
            id="addr"
            inputmode="url"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="192.168.1.20"
          />
          <button class="btn ghost" type="submit" id="manual-btn"></button>
        </form>
        <p id="manual-hint" class="small" style="margin-top: 6px"></p>
        <div class="btns">
          <button id="find-new" class="btn ghost hidden" type="button"></button>
        </div>
      </section>

      <section class="card">
        <h2 id="away-title"></h2>
        <p id="away-text" class="small"></p>
        <div class="btns">
          <a class="btn" id="away-btn" href="away.html"></a>
        </div>
      </section>

      <section class="card">
        <h2 id="home-title"></h2>
        <p id="home" class="small"></p>
      </section>

      <section class="card">
        <h2 id="dhcp-title"></h2>
        <p id="dhcp" class="small"></p>
      </section>

      <p id="privacy" class="small muted"></p>
    </main>
    <!-- 0.9.6: the TV's phone page inside the app (home.js) -->
    <div id="full" class="hidden">
      <!-- 0.9.7: back to the TVs (more than one TV) -->
      <div class="fullbar">
        <button id="full-tvs" class="btn ghost small" type="button"></button>
        <span id="full-name"></span>
      </div>
      <!-- sandboxed, no allow-same-origin: tv-frame.js -->
      <iframe
        id="full-frame"
        title="Sofa Tube"
        sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"
      ></iframe>
    </div>
    <script src="share-link.js"></script>
    <script src="away-crypto.js"></script>
    <script src="tv-frame.js"></script>
    <script src="home.js"></script>

         * address (service.js lanPublish). This phone, on the same Wi-Fi,
         * has the same public address: it asks the same STUN server (the
         * browser's own WebRTC), reads that topic and opens the note. The
         * relay sees only sealed text; nothing about this phone is sent.
         * Every note the relay still keeps (12 h) is read and opened here:
         * a busy topic (many TVs, or neighbours behind the same carrier
         * address, who share the topic and the key) buries nothing; the
         * newest addresses are tried first. HTTP 429 (the relay's limit

            var done = false;

                .then(function (o) {

                })
                .catch(function () {

                });

                end('');

            .digest('SHA-256', new TextEncoder().encode(text))
            .then(function (b) {

            .then(function (ip) {
              if (!ip) return [];
              return Promise.all([
                sha256('sofatube-lan-v1|' + ip),
                sha256('sofatube-lan-key-v1|' + ip)
              ]).then(function (h) {
                var topic =
                  'sofatube-lan-' +
                  Array.prototype.map
                    .call(h[0].slice(0, 16), function (x) {
                      return (x < 16 ? '0' : '') + x.toString(16);
                    })
                    .join('');
                return Promise.all([
                  crypto.subtle.importKey('raw', h[1], 'AES-GCM', false, [
                    'decrypt'

                  fetch(LAN_RELAY + '/' + topic + '/json?poll=1&since=13h', {
                    cache: 'no-store',
                    credentials: 'omit'
                  }).then(function (r) {
                    if (r.status === 429) limited = true;
                    return r.ok ? r.text() : '';

            .then(function (got) {
              if (!got || !got.length) return [];
              var key = got[0];

                .split('\n')
                .map(function (l) {
                  try {
                    return JSON.parse(l);
                  } catch (e) {
                    return null;

                .filter(function (m) {
                  return m && m.event === 'message' && m.message;

                .reverse()
                .slice(0, LAN_MAX_NOTES);

                notes.map(function (m) {
                  var raw;

                    .decrypt(

                      function () {

            .then(function (msgs) {

            box.className = 'tvname';
            var nm = document.createElement('strong');
            nm.textContent = t.name;
            var sub = document.createElement('span');
            sub.className = 'small';
            sub.textContent = tr('awayRow');
            box.appendChild(nm);
            box.appendChild(sub);
            var open = document.createElement('a');
            open.className = 'btn small';
            open.href =
              'away.html' +
              (t.id
                ? '#tv=' + t.id + (lang === 'ar' ? '&lang=ar' : '')
                : lang === 'ar'
                  ? '#lang=ar'
                  : '');
            open.textContent = tr('openAway');
            open.addEventListener('click', function () {
              gen++; // a search on its way stops
            });
            li.appendChild(box);
            li.appendChild(open);
            ul.appendChild(li);
          });
        }
        // which saved TVs answer on this Wi-Fi now (the list's dots); never
        // opens one
        var liveIps = [];
        function lookOnly() {
          var list = load();
          if (!list.length || !canLook) return;
          var my = ++gen;
          permission().then(function (state) {
            if (state !== 'granted' || my !== gen) return;
            sweepAll(candidates(list)[0], my, function (a) {
              if (my !== gen) return;
              liveIps = a.map(function (x) {
                return x.split(':')[0];
              });
              drawKnown();
            });
          });
        }

        function texts() {
          document.documentElement.lang = lang;
          $('join-how').textContent = tr('joinHow');
          $('join-stop').textContent = tr('joinCancel');
          $('join-same').textContent = tr('joinSame');
          $('join-diff').textContent = tr('joinDiff');
          $('go-home').textContent = tr('openHome');
          $('go-away').textContent = tr('openAway');
          $('find-new').textContent = tr('findAnother');
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          document.title = tr('title');
          $('manifest').setAttribute(
            'href',
            lang === 'ar' ? 'manifest-ar.webmanifest' : 'manifest.webmanifest'
          );
          $('title').textContent = tr('title');
          $('lang').textContent = tr('other');
          $('lead').textContent = tr('lead');
          $('known-title').textContent = tr('known');
          $('manual-btn').textContent = tr('manual');
          $('manual-hint').textContent = tr('manualHint');
          $('away-title').textContent = tr('awayTitle');
          $('away-text').textContent = tr('awayText');
          $('away-btn').textContent = tr('awayBtn');
          $('away-btn').href = 'away.html' + (lang === 'ar' ? '#lang=ar' : '');
          $('home-title').textContent = tr('homeTitle');
          $('home').textContent = tr('home');
          $('dhcp-title').textContent = tr('dhcpTitle');
          $('dhcp').textContent = tr('dhcp');
          $('privacy').textContent = tr('privacy');
          $('scan').textContent = tr('scan');
          $('scan-stop').textContent = tr('scanStop');
          $('share-card').classList.toggle('hidden', !share);
          if (share) {
            $('share-title').textContent = tr('shareTitle');
            $('share-what').textContent = !link
              ? shareQ
                ? tr('shareSearch', { q: shareQ })
                : ''
              : (link.v
                  ? tr('shareVideo', { v: link.v })
                  : tr('shareList', { l: link.list })) +
                (link.t > 0 ? ' · ' + tr('shareAt', { t: clock(link.t) }) : '');
            $('share-what').classList.toggle('hidden', !link && !shareQ);
          }
        }
        function clock(t) {
          var h = Math.floor(t / 3600);
          var m = Math.floor(t / 60) % 60;
          var x = t % 60;
          return (
            (h ? h + ':' + (m < 10 ? '0' : '') : '') +
            m +
            ':' +
            (x < 10 ? '0' : '') +
            x
          );
        }

        // what to do now: look, ask first, or open the last address
        function draw() {
          texts();
          drawKnown();
          if (
            searching ||
            scanStream ||
            joinTimer ||
            joinSt ||
            !$('pickbox').classList.contains('hidden')
          )
            return;
          var list = load();
          showScan(!list.length);
          showGo(null);
          $('find-new').classList.toggle(
            'hidden',
            !list.length || share || !canLook
          );
          if (share && !link && !shareQ) {
            setStatus(tr('shareBad'), 'bad');
            $('detail').textContent = tr('shareBadHow');
            showFind(false);
            return;
          }
          if (!list.length) {
            setStatus(tr(share ? 'shareFirst' : 'first'), '');
            $('detail').textContent = tr(share ? 'shareFirstHow' : 'firstHow');
            showFind(false);
            permission().then(function (state) {
              if (searching || load().length) return;
              if (state === 'unsupported' || state === 'denied') return;
              // Chrome: look on the Wi-Fi, then OK on the TV
              if (!share) $('detail').textContent = tr('firstHowNew');
              showFind(true, tr(share ? 'shareFind' : 'find'));
            });
            return;
          }
          if (welcome) {
            setStatus(tr('saved'), 'ok');
            $('detail').textContent = '';
            showFind(true, tr('find'));
            return;
          }
          // 0.9.7: more than one TV: the list, the owner picks
          if (pickMode()) {
            setStatus(lostNote ? tr('lostPick') : tr('pickTv'), '');
            $('detail').textContent = tr('pickTvHow');
            showFind(false);
            lookOnly();
            return;
          }
          permission().then(function (state) {
            if (searching) return;
            if (state === 'granted') return search();
            if (state === 'prompt') {
              setStatus('', '');
              $('detail').textContent = tr('ask');
              showFind(true, tr(share ? 'shareFind' : 'find'));
              return;
            }
            if (state === 'denied') {
              setStatus(tr('denied'), 'bad');
              $('detail').textContent = tr('deniedHow');
              showFind(true, tr('again'));
              return;
            }
            // no permission to ask for (Safari, Firefox, older Chrome): one
            // quick try in case the browser allows it, else the last address
            // (a shared video with more than one TV saved: the phone picks)
            if (share && list.length > 1) {
              setStatus(tr('sharePickSaved'), '');
              $('detail').textContent = '';
              return;
            }
            var my = ++gen;
            probe(list[0].a).then(function (ok) {
              if (my !== gen) return;
              if (ok) return found(list[0].a);
              // the TV's sealed note on the relay (it needs no request to
              // the Wi-Fi): a note for this home's public address = at home,
              // and it names the TV's address now
              setStatus(tr('searching'), '');
              lanFind().then(function (now) {
                if (my !== gen) return;
                var pick = relayPick(list, now);
                if (pick) return found(pick);
                awayPaired().then(function (away) {
                  if (my !== gen) return;
                  if (away && !share) {
                    // this browser cannot tell home from away: two buttons
                    setStatus(tr('noSearch'), '');
                    $('detail').textContent = tr('pickHomeAway');
                    showGo(list[0].a, true);
                    return;
                  }
                  setStatus(tr('noSearch'), '');
                  $('detail').textContent = tr('noSearchHow');
                  setTimeout(function () {
                    if (my === gen) go(list[0].a);
                  }, 1500);
                });
              });
            });
          });
        }

        /* ---------- start ---------- */
        var hash = {};
        location.hash
          .slice(1)
          .split('&')
          .forEach(function (kv) {
            var i = kv.indexOf('=');
            if (i > 0)
              try {
                hash[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
              } catch (e) {}
          });
        try {
          lang = localStorage.getItem(LANG_KEY) || '';
        } catch (e) {}
        if (hash.lang === 'ar' || hash.lang === 'en') {
          // the phone page's language (the TV's), kept for the next visits
          lang = hash.lang;
          try {
            localStorage.setItem(LANG_KEY, lang);
          } catch (e) {}
        }
        if (lang !== 'ar' && lang !== 'en')
          lang = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
        if (hash.share) {
          // Android's Share menu (sw.js / share.html put it after #)
          share = true;
          link = window.sofaShareLink
            ? window.sofaShareLink({
                // (a form's address: + is a space)
                title: String(hash.title || '').replace(/\+/g, ' '),
                text: String(hash.text || '').replace(/\+/g, ' '),
                url: String(hash.url || '').replace(/\+/g, ' ')
              })
            : null;
          sendHash = link ? window.sofaSendHash(link) : '';
          // text without a YouTube link: a search on the TV (0.9.5)
          shareQ =
            !link && window.sofaShareText
              ? window.sofaShareText({
                  title: String(hash.title || '').replace(/\+/g, ' '),
                  text: String(hash.text || '').replace(/\+/g, ' '),
                  url: String(hash.url || '').replace(/\+/g, ' ')
                })
              : '';
          if (shareQ) sendHash = window.sofaSearchHash(shareQ);
          // the shared link stays out of this page's address (and out of a
          // home-screen icon made from it)
          try {
            var last = load()[0];
            history.replaceState(
              null,
              '',
              location.pathname +
                (last ? '#tv=' + encodeURIComponent(last.a) : '')
            );
          } catch (e) {}
          hash = {};
        }
        var fromTv = parseAddr(hash.tv);
        if (fromTv) remember(fromTv);
        // the phone page's link carries the language too; a home-screen
        // icon only the address
        welcome = !!(fromTv && hash.lang);

        $('lang').addEventListener('click', function () {
          lang = lang === 'ar' ? 'en' : 'ar';
          try {
            localStorage.setItem(LANG_KEY, lang);
          } catch (e) {}
          texts();
          drawKnown();
          if (!searching) draw();
        });
        $('find').addEventListener('click', function () {
          welcome = false;
          if (load().length) search();
          else discover();
        });
        $('find-new').addEventListener('click', function () {
          welcome = false;
          window.scrollTo(0, 0);
          discover();
        });
        $('full-tvs').addEventListener('click', function () {
          hideFull();
          if (home) home.close();
          gen++;
          searching = false;
          draw();
        });
        $('join-same').addEventListener('click', joinSame);
        $('join-diff').addEventListener('click', joinDiff);
        $('join-stop').addEventListener('click', function () {
          gen++;
          joinEnd();
          draw();
        });
        $('scan').addEventListener('click', scan);
        $('scan-stop').addEventListener('click', function () {
          scanEnd();
          draw();
        });
        $('manual').addEventListener('submit', function (e) {
          e.preventDefault();
          var a = parseAddr($('addr').value);
          if (!a) {
            $('manual-hint').textContent = tr('badAddr');
            return;
          }
          $('addr').value = '';
          $('manual-hint').textContent = tr('manualHint');
          var known = load().some(function (x) {
            return x.a === a;
          });
          if (known) {
            gen++;
            searching = false;
            return draw();
          }
          // a new TV: ask it to join (OK on the TV); a browser that cannot
          // reach it from here opens its address as before
          var my = ++gen;
          probe(a).then(function (ok) {
            if (my !== gen) return;
            if (ok) return join(a);
            remember(a);
            searching = false;
            draw();
          });
        });

        if ('serviceWorker' in navigator)
          navigator.serviceWorker.register('sw.js').catch(function () {});
        awayTvs().then(
          function (l) {
            awayList = l;
            draw();
          },
          function () {
            draw();
          }
        );
      })();
    </script>
  </body>
</html>
