<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sofa Tube · Control from away</title>
    <meta
      name="description"
      content="Control the family TV from outside the home, end-to-end encrypted."
    />
    <link id="manifest" rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      name="theme-color"
      content="#fbf4e8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#170e08"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // the look chosen on this phone (theme.js) before the first paint
      (function () {
        try {
          var t = localStorage.getItem('ytx-theme');
          if (t !== 'light' && t !== 'dark') return;
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < m.length; i++)
            m[i].setAttribute('content', t === 'dark' ? '#170e08' : '#fbf4e8');
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sofa Tube" />
    <style>
      :root {
        --bg: #fbf4e8;
        --card: #ffffff;
        --line: #eadfcd;
        --text: #1f140d;
        --muted: #6f5a47;
        --field: #f5ecdf;
        --field-line: #e0d0b9;
        --accent: #a84500;
        --accent-ink: #ffffff;
        --title: #93441a;
        --ok: #1b7f37;
        --bad: #c62828;
      }
      /* dark: the phone's setting, or the person's choice (theme.js) */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #170e08;
          --card: #24180f;
          --line: #3a2819;
          --text: #fbf4e8;
          --muted: #b9a690;
          --field: #2f2015;
          --field-line: #4e3624;
          --accent: #ff8a00;
          --accent-ink: #1f140d;
          --title: #fbf4e8;
          --ok: #4cc26a;
          --bad: #ff6b6b;
        }
      }
      :root[data-theme='dark'] {
        --bg: #170e08;
        --card: #24180f;
        --line: #3a2819;
        --text: #fbf4e8;
        --muted: #b9a690;
        --field: #2f2015;
        --field-line: #4e3624;
        --accent: #ff8a00;
        --accent-ink: #1f140d;
        --title: #fbf4e8;
        --ok: #4cc26a;
        --bad: #ff6b6b;
      }
      /* the page's own controls and scroll bars follow the choice too (the
         frame of the TV's page keeps its own, #full iframe) */
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      /* the light or dark button: a 44 px touch target */
      #theme {
        background: none;
        border: 1px solid var(--field-line);
        color: var(--text);
        border-radius: 999px;
        width: 44px;
        height: 44px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex: 0 0 auto;
      }
      #theme svg {
        width: 22px;
        height: 22px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Noto Sans Arabic',
          sans-serif;
      }
      html[lang='ar'] body {
        font-size: 17px;
        line-height: 1.65;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 16px 16px 40px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0 12px;
      }
      header img {
        width: 44px;
        height: 44px;
      }
      h1 {
        font-size: 21px;
        margin: 0;
        color: var(--title);
        flex: 1;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 6px;
        color: var(--title);
      }
      p {
        margin: 0 0 10px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        margin: 12px 0;
      }
      .small,
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 14px;
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .btn {
        background: var(--accent);
        color: var(--accent-ink);
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        min-height: 44px;
      }
      .btn.ghost {
        background: var(--field);
        color: var(--text);
        border: 1px solid var(--field-line);
      }
      .btn.warn {
        background: var(--bad);
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.5;
      }
      input {
        font: inherit;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--field-line);
        background: var(--field);
        color: var(--text);
        min-height: 44px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      .row input {
        flex: 1;
        min-width: 0;
      }
      .hidden {
        display: none !important;
      }
      /* the family's own relay (advanced, this phone only) */
      #relay-box {
        margin-top: 12px;
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      #relay-box summary {
        cursor: pointer;
        font-weight: 600;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      #relay-form label {
        display: block;
        margin-top: 8px;
      }
      #relay-form input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
      }
      /* the whole phone page from away, over the direct channel (P2P) */
      #full {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        background: var(--bg, #1a120d);
      }
      #full .fullbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        font-size: 13px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      #full .fullbar span {
        flex: 1;
      }
      #full iframe {
        flex: 1;
        border: 0;
        width: 100%;
        /* no color-scheme here: the TV's page takes its light or dark
           from it (index.html); hidden until that page is in */
      }
      /* no page in it yet (the TV's page comes over the channel first) */
      #full iframe:not([srcdoc]) {
        visibility: hidden;
      }
      /* 0.9.7: the paired TVs */
      #tvs {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #tvs li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      #tvs li:first-child {
        border-top: 0;
      }
      #tvs li.cur strong {
        color: var(--accent);
      }
      #tvs .tvtext {
        flex: 1 1 140px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow-wrap: anywhere;
      }
      #tvs .btns {
        margin-top: 0;
      }
      .btn.small {
        padding: 8px 12px;
        font-size: 14px;
      }
      #code {
        letter-spacing: 0.05em;
        font-variant-numeric: tabular-nums;
      }
      #code-box label {
        display: block;
        margin-top: 10px;
      }
      .words {
        font-size: 24px;
        font-weight: 800;
        text-align: center;
        margin: 10px 0;
        color: var(--title);
      }
      dl {
        display: flex;
        flex-wrap: wrap;
        margin: 0;
      }
      dt {
        width: 45%;
        color: var(--muted);
        padding: 4px 0;
      }
      dd {
        width: 55%;
        margin: 0;
        padding: 4px 0;
        font-weight: 600;
        unicode-bidi: plaintext;
      }
      #status.ok {
        color: var(--ok);
      }
      #status.bad {
        color: var(--bad);
      }
      #status {
        font-weight: 600;
      }
      #scanbox video,
      #scanbox canvas {
        width: 100%;
        max-height: 55vh;
        border-radius: 10px;
        background: #000;
        margin-top: 10px;
      }
      .req {
        border-top: 1px solid var(--line);
        padding: 8px 0;
      }
      .req:first-child {
        border-top: 0;
      }
      #lang {
        background: none;
        border: 1px solid var(--field-line);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 10px;
        font: inherit;
        font-size: 14px;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="icon-192.png" alt="" />
        <h1 id="title"></h1>
        <button id="theme" type="button"></button>
        <button id="lang" type="button"></button>
      </header>
      <p id="status" role="status" aria-live="polite"></p>

      <!-- the phone PIN (when set) -->
      <section class="card hidden" id="lock-card">
        <h2 id="lock-title"></h2>
        <form class="row" id="lock-form">
          <input
            id="lock-pin"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            maxlength="8"
          />
          <button class="btn" type="submit" id="lock-btn"></button>
        </form>
      </section>

      <!-- not installed (iPhone keeps a separate storage per Home Screen app) -->
      <section class="card hidden" id="install-card">
        <h2 id="install-title"></h2>
        <p id="install-text" class="small"></p>
      </section>

      <!-- 0.9.7: the paired TVs (more than one: the owner picks) -->
      <section class="card hidden" id="tvs-card">
        <h2 id="tvs-title"></h2>
        <p id="tvs-pick" class="small hidden"></p>
        <ul id="tvs"></ul>
        <div class="btns">
          <button class="btn ghost" id="tv-add" type="button"></button>
        </div>
      </section>

      <!-- pairing -->
      <section class="card hidden" id="pair-card">
        <h2 id="pair-title"></h2>
        <p id="pair-text" class="small"></p>
        <div class="row">
          <input id="phone-name" maxlength="40" autocomplete="off" />
        </div>
        <div class="btns" id="pair-ways">
          <button class="btn" id="scan" type="button"></button>
          <button class="btn ghost" id="code-open" type="button"></button>
          <button
            class="btn ghost hidden"
            id="share-link"
            type="button"
          ></button>
          <button
            class="btn ghost hidden"
            id="pair-cancel"
            type="button"
          ></button>
        </div>
        <!-- 0.9.7: the TV's 12-digit number, or a pairing link from a message -->
        <form id="code-box" class="hidden" autocomplete="off">
          <label class="small" for="code" id="code-label"></label>
          <div class="row" id="code-form-row">
            <input
              id="code"
              dir="ltr"
              inputmode="numeric"
              autocapitalize="off"
              spellcheck="false"
              maxlength="2100"
            />
            <button class="btn" type="submit" id="code-btn"></button>
          </div>
        </form>
        <div id="scanbox" class="hidden">
          <video id="scanvideo" playsinline muted></video>
          <canvas id="scancanvas" class="hidden"></canvas>
          <div class="btns">
            <button class="btn ghost" id="scan-stop" type="button"></button>
          </div>
        </div>
        <div id="words-box" class="hidden">
          <p id="words-text" class="small"></p>
          <div class="words" id="words"></div>
          <p id="words-wait" class="small"></p>
          <p id="words-far" class="small"></p>
        </div>
      </section>

      <!-- now -->
      <section class="card hidden" id="now-card">
        <h2 id="now-title"></h2>
        <dl id="now"></dl>
        <p id="now-note" class="small"></p>
        <div class="btns">
          <button class="btn ghost" id="refresh" type="button"></button>
          <button class="btn hidden" id="full-open" type="button"></button>
        </div>
        <p class="small" id="full-note"></p>
      </section>

      <section class="card hidden" id="reqs-card">
        <h2 id="reqs-title"></h2>
        <div id="reqs"></div>
      </section>

      <section class="card hidden" id="cmd-card">
        <h2 id="cmd-title"></h2>
        <p class="small" id="more-label"></p>
        <div class="btns">
          <button class="btn" data-more="15" type="button" dir="ltr">
            +15
          </button>
          <button class="btn" data-more="30" type="button" dir="ltr">
            +30
          </button>
          <button class="btn" data-more="60" type="button" dir="ltr">
            +60
          </button>
        </div>
        <div class="btns">
          <button class="btn ghost" id="lock" type="button"></button>
          <button class="btn warn" id="off" type="button"></button>
        </div>
        <form class="row" id="msg-form">
          <input id="msg" maxlength="200" autocomplete="off" />
          <button class="btn ghost" type="submit" id="msg-btn"></button>
        </form>
        <form class="row" id="bed-form">
          <label for="bed" id="bed-label" class="small"></label>
          <input id="bed" type="time" />
          <button class="btn ghost" type="submit" id="bed-btn"></button>
        </form>
      </section>

      <section class="card hidden" id="set-card">
        <h2 id="set-title"></h2>
        <p class="small" id="notif-state"></p>
        <div class="btns">
          <button class="btn ghost" id="notif" type="button"></button>
          <button class="btn ghost" id="pin-set" type="button"></button>
        </div>
        <details id="relay-box">
          <summary id="relay-title"></summary>
          <p class="small" id="relay-text"></p>
          <form id="relay-form" autocomplete="off">
            <label class="small" for="relay-url" id="relay-url-label"></label>
            <input
              id="relay-url"
              dir="ltr"
              inputmode="url"
              autocapitalize="off"
              spellcheck="false"
              maxlength="400"
            />
            <label class="small" for="relay-user" id="relay-user-label"></label>
            <input
              id="relay-user"
              dir="ltr"
              autocapitalize="off"
              spellcheck="false"
              maxlength="200"
            />
            <label class="small" for="relay-pass" id="relay-pass-label"></label>
            <input
              id="relay-pass"
              type="password"
              dir="ltr"
              autocomplete="new-password"
              maxlength="400"
            />
            <div class="btns">
              <button class="btn ghost" type="submit" id="relay-save"></button>
              <button
                class="btn ghost hidden"
                type="button"
                id="relay-remove"
              ></button>
            </div>
            <p class="small" id="relay-state" role="status"></p>
          </form>
        </details>
        <p class="small" id="help"></p>
      </section>
    </main>
    <div id="full" class="hidden">
      <div class="fullbar">
        <span id="full-state"></span>
        <button class="btn ghost" id="full-tvs" type="button"></button>
        <button class="btn ghost" id="full-simple" type="button"></button>
      </div>
      <!-- sandboxed, no allow-same-origin: tv-frame.js -->
      <iframe
        id="full-frame"
        title="Sofa Tube"
        sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"
      ></iframe>
    </div>
    <script src="away-crypto.js"></script>
    <script src="theme.js"></script>
    <script src="tv-more.js"></script>
    <script src="tv-voice.js"></script>
    <script src="tv-frame.js"></script>
    <script src="dc-pieces.js"></script>
    <script src="jsqr.min.js" defer></script>
    <script src="away.js"></script>
  </body>
</html>
